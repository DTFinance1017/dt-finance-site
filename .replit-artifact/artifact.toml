kind = "web"
previewPath = "/"
title = "DT Finance"
version = "1.0.0"
id = "artifacts/dt-finance"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22353

[services.development]
run = "pnpm --filter @workspace/dt-finance run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dt-finance", "run", "build" ]
publicDir = "artifacts/dt-finance/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22353"
BASE_PATH = "/"
