    <!-- ── Suprimir widgets Replit ────────────────────────────────────── -->
    <meta name="replit:disable_agent_feedback" content="true" />
    <style>
      body > *:not(#root) { display: none !important; }
    </style>

    <!-- ── Fontes ─────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var KEYWORDS = ['Share your feedback', 'Help improve this app', 'sharing your feedback with the creator'];
        var IFRAME_PATTERNS = ['replit.com', 'agent_inbox', '__replco'];

        function removeReplitWidgets() {
          document.querySelectorAll('iframe').forEach(function (el) {
            var src = el.src || el.getAttribute('src') || '';
            if (IFRAME_PATTERNS.some(function(p){ return src.includes(p); })) {
              var wrapper = el.parentElement || el;
              wrapper.style.display = 'none';
              wrapper.remove();
            }
          });
          document.querySelectorAll('body > div:not(#root)').forEach(function (el) {
            var html = el.innerHTML || '';
            if (KEYWORDS.some(function(k){ return html.includes(k); })) {
              el.style.display = 'none';
              el.remove();
            }
          });
        }

        removeReplitWidgets();
        setInterval(removeReplitWidgets, 300);
        new MutationObserver(removeReplitWidgets).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
